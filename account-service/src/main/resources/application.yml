# Every value can be overridden with the environment variable named in ${...}.
# Defaults are for local development; see .env.example.

server:
  port: ${PORT:8081}

spring:
  config:
    # Local runs read KEY=value lines from a .env file next to pom.xml (copy .env.example).
    # That file is in .gitignore and .dockerignore, so no password is ever committed or baked into an image.
    import: optional:file:.env[.properties]
  application:
    name: account-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/account_db}
    username: ${DB_USERNAME:account_user}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration)
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

account:
  # atomic = the safe conditional UPDATE (always use this)
  # naive  = read, check in Java, then write: DELIBERATELY BROKEN, only to show the race in the Challenge 1 demo
  hold-strategy: ${HOLD_STRATEGY:atomic}
  # Pause between the read and the write in naive mode, to make the race easy to hit
  naive-delay-ms: ${NAIVE_DELAY_MS:50}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Structured JSON logs; MDC field requestId is included in every line.
logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
  level:
    com.moneytransfer: ${LOG_LEVEL:INFO}
