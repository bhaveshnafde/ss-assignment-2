# Local development only: the Account service's own PostgreSQL database.
# docker compose -f docker-compose.dev.yml up -d
#
# Host port 5434 so it can run next to the Transfer service's database (5433).
services:
  account-db:
    image: postgres:16
    environment:
      POSTGRES_DB: account_db
      POSTGRES_USER: account_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "5434:5432"
    volumes:
      - account-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_user -d account_db"]
      interval: 5s
      retries: 10

volumes:
  account-db-data:
