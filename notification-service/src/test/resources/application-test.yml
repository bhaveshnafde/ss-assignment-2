# In-memory H2 in PostgreSQL mode, so `mvn test` needs no database.
spring:
  datasource:
    url: jdbc:h2:mem:notification_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
