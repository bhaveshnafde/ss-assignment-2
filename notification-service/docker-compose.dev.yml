# Local development only: the Notification service's own PostgreSQL database.
# docker compose -f docker-compose.dev.yml up -d
#
# Host port 5437, next to Transfer (5433), Account (5434), Ledger (5435) and Limits (5436).
services:
  notification-db:
    image: postgres:16
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "5437:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      retries: 10

volumes:
  notification-db-data:
