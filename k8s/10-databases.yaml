# One PostgreSQL per service: a StatefulSet with its own volume, and a Service named <name>-db.
---
apiVersion: v1
kind: Service
metadata:
  name: transfer-db
  namespace: money-transfer
  labels: { app: transfer-db, tier: database }
spec:
  selector: { app: transfer-db }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: transfer-db
  namespace: money-transfer
  labels: { app: transfer-db, tier: database }
spec:
  serviceName: transfer-db
  replicas: 1
  selector:
    matchLabels: { app: transfer-db }
  template:
    metadata:
      labels: { app: transfer-db, tier: database }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: transfer_db
            - name: POSTGRES_USER
              value: transfer_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: transfer-db-password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U transfer_user -d transfer_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
