# Copy to secrets.yaml (it is in .gitignore) and replace every "change-me", then:
#   kubectl apply -f k8s/secrets.yaml
# Or create it without a file:
#   kubectl -n money-transfer create secret generic db-credentials \
#     --from-literal=transfer-db-password=... --from-literal=account-db-password=... \
#     --from-literal=ledger-db-password=... --from-literal=limits-db-password=... \
#     --from-literal=notification-db-password=...
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: money-transfer
type: Opaque
stringData:
  transfer-db-password: change-me
  account-db-password: change-me
  ledger-db-password: change-me
  limits-db-password: change-me
  notification-db-password: change-me
