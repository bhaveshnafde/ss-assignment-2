# The six application services: a Deployment and a Service each.
# Images are built into Minikube first (see k8s/README.md), so imagePullPolicy is IfNotPresent.
---
# account-service · 2 replicas: stateless; the atomic SQL UPDATE keeps money correct across pods (scaling demo)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: money-transfer
  labels: { app: account-service, tier: app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: account-service }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: account-service, tier: app }
    spec:
      initContainers:
        # Wait until this service's database accepts connections, so the service starts cleanly
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h account-db -p 5432; do echo waiting for account-db; sleep 2; done"]
      containers:
        - name: account-service
          image: money-transfer/account-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://account-db:5432/account_db
            - name: DB_USERNAME
              value: account_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: account-db-password }
            - name: HOLD_STRATEGY
              value: "atomic"
            - name: LOG_FORMAT
              value: "logstash"
          # Java takes a while to start: liveness checks only begin once the startup probe has passed
          startupProbe:
            httpGet: { path: /health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: money-transfer
  labels: { app: account-service }
spec:
  type: ClusterIP
  selector: { app: account-service }
  ports:
    - port: 8081
      targetPort: 8081
---
