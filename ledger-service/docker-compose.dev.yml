# Local development only: the Ledger service's own PostgreSQL database.
# docker compose -f docker-compose.dev.yml up -d
#
# Host port 5435, next to Transfer's (5433) and Account's (5434).
services:
  ledger-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "5435:5432"
    volumes:
      - ledger-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d ledger_db"]
      interval: 5s
      retries: 10

volumes:
  ledger-db-data:
