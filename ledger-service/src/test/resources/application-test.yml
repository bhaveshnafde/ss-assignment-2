# In-memory H2 in PostgreSQL mode, so `mvn test` needs no database.
# Flyway applies db/migration/common only (there is no db/migration/h2 folder):
# the PostgreSQL triggers are verified separately on a real PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:ledger_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
